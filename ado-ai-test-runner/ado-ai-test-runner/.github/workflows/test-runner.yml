name: ADO AI Test Runner

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # 1. Manual trigger from the GitHub Actions UI
  #    → Go to Actions tab → "ADO AI Test Runner" → "Run workflow"
  workflow_dispatch:
    inputs:
      sprint_name:
        description: 'Sprint name (must match ADO iteration name)'
        required: true
        type: string
        default: 'Sprint 42'
      environment:
        description: 'Target environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - UAT
          - PROD

  # 2. Triggered automatically from ADO Service Hook (future upgrade)
  #    Set up: ADO → Project Settings → Service Hooks → Web Hook
  #    Event: "Run stage state changed" → State: Succeeded
  #    URL: https://api.github.com/repos/YOUR_ORG/ado-ai-test-runner/dispatches
  #    See README.md for full setup instructions
  repository_dispatch:
    types: [run-tests]

# ── Job ────────────────────────────────────────────────────────────────────────
jobs:
  run-tests:
    name: Run AI test automation
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run AI test automation
        run: node index.js
        env:
          # Sprint and environment
          # workflow_dispatch: from inputs
          # repository_dispatch: from client_payload (sent by ADO Service Hook)
          SPRINT_NAME: ${{ github.event.inputs.sprint_name || github.event.client_payload.sprint_name }}
          TARGET_ENV:  ${{ github.event.inputs.environment || github.event.client_payload.environment || 'QA' }}

          # ADO connection
          ADO_ORG:     ${{ secrets.ADO_ORG }}
          ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
          AUTH_MODE:   ${{ secrets.AUTH_MODE }}       # 'pat' or 'entra'
          ADO_PAT:     ${{ secrets.ADO_PAT }}

          # Entra ID (only needed when AUTH_MODE=entra)
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

          # App credentials for browser login
          APP_AUTH_MODE: ${{ secrets.APP_AUTH_MODE }}   # 'credentials' or 'entra'
          APP_USERNAME:  ${{ secrets.APP_USERNAME }}
          APP_PASSWORD:  ${{ secrets.APP_PASSWORD }}

          # Claude AI
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 7
